apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: dashboard}
  template:
    metadata:
      labels: {app: dashboard}
    spec:
      containers:
        - name: dashboard
          image: selfheal-mlops:latest
          imagePullPolicy: Never
          command: ["streamlit","run","selfheal/dashboard.py","--server.port=8501","--server.address=0.0.0.0","--server.headless=true"]
          envFrom: [{configMapRef: {name: selfheal-config}}]
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom: {secretKeyRef: {name: anthropic, key: api-key, optional: true}}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: selfheal-data}
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
spec:
  type: NodePort
  selector: {app: dashboard}
  ports: [{port: 8501, targetPort: 8501, nodePort: 30851}]
