apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: monitor}
  template:
    metadata:
      labels: {app: monitor}
    spec:
      containers:
        - name: monitor
          image: selfheal-mlops:latest
          imagePullPolicy: Never
          command: ["python","-m","selfheal.monitoring.monitor"]
          envFrom: [{configMapRef: {name: selfheal-config}}]
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom: {secretKeyRef: {name: anthropic, key: api-key, optional: true}}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: selfheal-data}
