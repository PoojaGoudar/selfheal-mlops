name: CI
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e: {description: "Run the full healing-loop E2E", type: boolean, default: false}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check selfheal tests
      - name: Unit tests (feature parity, drift maths, router, gate, API, copilot)
        run: PYTHONPATH=. pytest
      - name: Healing-loop E2E (manual trigger only)
        if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
        run: PYTHONPATH=. python -m selfheal.e2e

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: selfheal-mlops:${{ github.sha }}
